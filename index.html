<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FEB BMS 3D Viewer</title>

    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
    </script>

    <style>

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #111;
            font-family: Arial, sans-serif;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #151515;
        }

    </style>

</head>


<body>

    <model-viewer

        src="FEB_BMS.glb"

        alt="FEB Battery Management System PCB"

        camera-controls

        auto-rotate

        shadow-intensity="1"

        exposure="1"

        touch-action="pan-y">

    </model-viewer>

</body>

</html>
